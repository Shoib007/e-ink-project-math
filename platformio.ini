; PlatformIO Project Configuration File
;
;   Build options: build flags, source filter
;   Upload options: custom upload port, speed and extra flags
;   Library options: dependencies, extra library storages
;   Advanced options: extra scripting
;
; Please visit documentation for the other options and examples
; https://docs.platformio.org/page/projectconf.html

[env:esp32s3_n16r8]
platform = espressif32@6.9.0
board = esp32-s3-devkitc-1
framework = arduino

lib_deps =
    ZinggJM/GxEPD2 @ ^1.6.8
    adafruit/Adafruit GFX Library @ ^1.11.9
    bblanchon/ArduinoJson @ ^7.0.0
    bitbank2/PNGdec @ ^1.0.1
    bodmer/TJpg_Decoder @ ^1.1.0

monitor_speed = 115200
board_build.filesystem = littlefs

; --- N16R8 Memory: 16MB Quad Flash + 8MB Octal PSRAM ---
board_build.arduino.memory_type = qio_opi
board_build.flash_mode = qio
board_build.psram_type = opi
board_upload.flash_size = 16MB
board_upload.maximum_size = 16777216
board_build.partitions = default_16MB.csv

; PNGdec keeps current+previous 32-bit scanlines in a fixed inline buffer
; (default = 320px wide max).  Raise it to 2048px so wide RGBA images cannot
; overrun the renderer object (this was corrupting _sdMutex / crashing).
build_flags =
    -DBOARD_HAS_PSRAM
    -DPNG_MAX_BUFFERED_PIXELS=16386

; Custom targets (e.g.  pio run -t clear_cache)
extra_scripts = extra_scripts.py
