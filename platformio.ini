; PlatformIO Project Configuration File
;
;   Build options: build flags, source filter
;   Upload options: custom upload port, speed and extra flags
;   Library options: dependencies, extra library storages
;   Advanced options: extra scripting
;
; Please visit documentation for the other options and examples
; https://docs.platformio.org/page/projectconf.html

[env:seeed_xiao_esp32s3]
platform = espressif32@6.9.0
board = seeed_xiao_esp32s3
framework = arduino

lib_deps =
    ZinggJM/GxEPD2 @ ^1.6.8
    adafruit/Adafruit GFX Library @ ^1.11.9
    bblanchon/ArduinoJson @ ^7.0.0
    bitbank2/PNGdec @ ^1.0.1
    bodmer/TJpg_Decoder @ ^1.1.0

monitor_speed = 115200
board_build.flash_mode = dio
board_build.psram = enabled   ; XIAO ESP32-S3 has 8MB PSRAM - use it!
board_build.filesystem = littlefs   ; data/ -> web upload page (flash via `pio run -t uploadfs`)

; PNGdec keeps current+previous 32-bit scanlines in a fixed inline buffer
; (default = 320px wide max).  Raise it to 2048px so wide RGBA images cannot
; overrun the renderer object (this was corrupting _sdMutex / crashing).
build_flags =
    -DPNG_MAX_BUFFERED_PIXELS=16386

; Custom targets (e.g.  pio run -t clear_cache)
extra_scripts = extra_scripts.py
